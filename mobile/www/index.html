<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digiteq</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; font-family: system-ui, sans-serif; background: #f5f6fa; color: #0f172a; }

</html>
