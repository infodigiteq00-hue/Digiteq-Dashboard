<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Digiteq company dashboard: clients, tasks and team">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Digiteq">
  <title>Digiteq Dashboard</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Apply the saved theme before first paint (light by default).
    try { document.documentElement.dataset.theme = localStorage.getItem('dq_theme') || 'light'; } catch { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div id="app"><div class="boot"><div class="spinner"></div></div></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
